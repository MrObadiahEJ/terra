[package]
name = "terra-registry"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "terra_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
solana-program = "3.0.0"

[dev-dependencies]
solana-program-test = "3.0.0"
solana-sdk = "3.0.0"
solana-sdk-ids = "3.0.0"
borsh = "1.0"
