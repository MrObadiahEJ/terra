[package]
name = "terra-registry"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "terra_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
solana-program = "3.0.0"
# BN254 alt_bn128 group operations (EVM precompile-compatible). On-chain
# builds dispatch to the `sol_alt_bn128_group_op` syscall; already present
# in Cargo.lock via agave-syscalls, so this adds no new crates.
solana-bn254 = "3.2.1"
terra-identity = { path = "../terra_identity", features = ["no-entrypoint"] }

[dev-dependencies]
ed25519-dalek = "2.2"
# Groth16 proving for tests only (the on-chain program verifies via
# solana-bn254 syscalls and never links arkworks).
ark-groth16 = "0.5.0"
ark-bn254 = "0.5.0"
ark-relations = "0.5.0"
ark-ff = "0.5.0"
ark-std = "0.5.0"
terra-zk-membership = { path = "../../zk-membership" }
solana-program-test = { version = "3.0.0", features = ["agave-unstable-api"] }
solana-sdk = "3.0.0"
solana-sdk-ids = "3.0.0"
borsh = "1.0"
terra-identity = { path = "../terra_identity" }
