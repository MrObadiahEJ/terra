[package]
name = "terra-identity"
version = "0.1.0"
description = "Terra Identity program — PEOPLE domain (identity, succession, guardianship)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "terra_identity"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.1.2" }

[dev-dependencies]
solana-program-test = "3.0.0"
solana-sdk = "3.0.0"
solana-sdk-ids = "3.0.0"
borsh = "1.0"
