[package]
name = "terra-identity"
version = "0.1.0"
description = "Identity & succession program for Terra land registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "terra_identity"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
