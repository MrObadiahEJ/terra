name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lib-tests:
    name: On-chain Program Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terra-core -> target

      - name: Check formatting
        run: cargo fmt --check
        working-directory: terra-core

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: terra-core

      - name: Unit tests (registry lib)
        run: cargo test -p terra-registry --lib
        working-directory: terra-core

      - name: Unit tests (identity lib)
        run: cargo test -p terra-identity --lib
        working-directory: terra-core

      # R-008: the ProgramTest-based suites load prebuilt `.so` artifacts and
      # refuse to run against a stale build. Build them in CI before the
      # security suite and the full BPF suite (307 tests) — the same gate used
      # locally.
      # Pin the toolchain to the 3.1.x line that matches `solana-program-test`
      # in Cargo.lock: artifacts built by a newer (SBPF v3) toolchain are
      # rejected by the pinned runtime ("Unsupported program id"). Bump both
      # together.
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build program artifacts (SBF)
        run: |
          mkdir -p target/deploy
          cargo build-sbf --manifest-path programs/terra_registry/Cargo.toml --sbf-out-dir "$PWD/target/deploy"
          cargo build-sbf --manifest-path programs/terra_identity/Cargo.toml --sbf-out-dir "$PWD/target/deploy"
        working-directory: terra-core

      # Sprint A: the lifecycle smoke runs the exact .so artifacts built here
      # against Surfpool in the `localnet-e2e` job.
      - name: Upload program artifacts
        uses: actions/upload-artifact@v4
        with:
          name: program-artifacts
          path: |
            terra-core/target/deploy/terra_registry.so
            terra-core/target/deploy/terra_identity.so
          if-no-files-found: error
          retention-days: 3

      - name: RFC-016 security tests
        run: cargo test -p terra-registry --test security
        working-directory: terra-core

      - name: RFC-012 structural tests
        run: cargo test -p terra-registry --test rfc012_structure
        working-directory: terra-core

      - name: Geo engine tests
        run: cargo test -p terra-geo
        working-directory: terra-core

      - name: BPF integration tests
        run: cargo test -p terra-registry --test integration -- --test-threads=1
        working-directory: terra-core

      # The identity program suite loads terra_identity.so, which is built
      # above alongside the registry artifact. Run it explicitly so identity
      # regressions cannot hide behind the registry suite.
      - name: BPF identity integration tests
        run: cargo test -p terra-identity --test integration -- --test-threads=1
        working-directory: terra-core

  localnet-e2e:
    name: Localnet Lifecycle E2E (Surfpool)
    runs-on: ubuntu-latest
    needs: lib-tests
    env:
      SURFPOOL_VERSION: "1.7.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: terra-core/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: terra-core

      - name: Download program artifacts
        uses: actions/download-artifact@v4
        with:
          name: program-artifacts
          path: terra-core/target/deploy

      # Surfpool runs a local Surfnet without AVX. Instant deployment comes
      # from the committed runbook (`runbooks/deployment/main.tx`).
      - name: Install Surfpool
        run: |
          curl -sSfL -o /tmp/surfpool.tar.gz \
            "https://github.com/solana-foundation/surfpool/releases/download/v${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz"
          tar -xzf /tmp/surfpool.tar.gz -C /tmp
          sudo install /tmp/surfpool /usr/local/bin/surfpool
          surfpool --version

      - name: Run lifecycle smoke
        run: ./scripts/run-localnet-e2e.sh
        working-directory: terra-core

  secrets:
    name: Secret Scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan every commit
        run: /tmp/gitleaks detect --source . --no-banner --redact -v

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: terra
          POSTGRES_PASSWORD: terra
          POSTGRES_DB: terra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://terra:terra@localhost:5432/terra_test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terra-core -> target

      - name: Run migrations
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6

      - name: Apply migrations
        run: sqlx migrate run --source api/migrations
        working-directory: terra-core

      - name: API unit tests
        run: cargo test -p terra-api
        working-directory: terra-core

  api-build:
    name: API Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terra-core -> target

      - name: Build check
        run: cargo build -p terra-api
        working-directory: terra-core

  frontend:
    name: Frontend Type Check + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: terra-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc -b

      - name: Unit tests
        run: pnpm exec vitest run

      # R-012: build the app and enforce the bundle budget. Cesium (~1.1 MB
      # gzip) must stay behind a lazy route import; the initial graph and the
      # total shipped JS have ceilings.
      - name: Build + bundle budget
        run: pnpm build:check
