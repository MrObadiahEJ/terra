name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lib-tests:
    name: On-chain Program Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terra-core -> target

      - name: Check formatting
        run: cargo fmt --check
        working-directory: terra-core

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: terra-core

      - name: Unit tests
        run: cargo test -p terra-registry --lib
        working-directory: terra-core

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: terra
          POSTGRES_PASSWORD: terra
          POSTGRES_DB: terra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://terra:terra@localhost:5432/terra_test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terra-core -> target

      - name: Run migrations
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6

      - name: Apply migrations
        run: sqlx migrate run --source api/migrations
        working-directory: terra-core

      - name: API unit tests
        run: cargo test -p terra-api
        working-directory: terra-core

  api-build:
    name: API Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terra-core -> target

      - name: Build check
        run: cargo build -p terra-api
        working-directory: terra-core

  frontend:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terra-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: terra-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit
